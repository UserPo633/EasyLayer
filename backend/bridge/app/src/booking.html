<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EasyLayer booking</title>
<style>
:root{font-family:system-ui,sans-serif;color:#183f32;background:transparent}*{box-sizing:border-box}body{margin:0;padding:12px}main{border:1px solid #d4dfd2;border-radius:24px;padding:clamp(20px,4vw,40px);background:#f9faf5;max-width:880px;margin:auto}.brand{font-size:15px;font-weight:750;letter-spacing:.06em;color:#436451}h1{font-size:clamp(25px,4vw,40px);line-height:1.15;margin:18px 0}#status{display:inline-block;background:#e1ebdf;border-radius:50px;padding:6px 14px;font-size:17px}dl{display:grid;grid-template-columns:minmax(90px,1fr) minmax(0,2fr);gap:14px;font-size:clamp(19px,2.6vw,26px);margin:24px 0}dt{color:#5a6c61}dd{margin:0;font-weight:650;overflow-wrap:anywhere}#message{font-size:18px;line-height:1.5}.actions{display:flex;gap:12px;flex-wrap:wrap}button{font:600 18px/1.4 system-ui;min-height:52px;padding:13px 20px;border-radius:12px;border:1px solid #245d42;background:white;color:#245d42;cursor:pointer}button.primary{background:#245d42;color:white}button:disabled{opacity:.5;cursor:default}button[hidden]{display:none}:focus-visible{outline:3px solid #b47700;outline-offset:4px}.note{font-size:14px;color:#5a6c61;line-height:1.5;margin-top:24px}@media(max-width:380px){dl{grid-template-columns:1fr;gap:6px}dd{margin-bottom:12px}.actions button{width:100%}}
</style></head><body><main aria-labelledby="title"><p class="brand">EASYLAYER · BOOKING</p><h1 id="title">Your booking, clearly.</h1><span id="status">Waiting for your assistant</span><dl id="summary"></dl><p id="message" role="status" aria-live="polite">Open this view from a compatible MCP host to see your booking.</p><div class="actions"><button id="review" class="primary" hidden>Review details</button><button id="refresh" disabled>Refresh status</button><button id="complete" class="primary" hidden>Complete approved booking</button></div><p class="note">This version uses a separate page for contact details and approval. A booking is complete only after the original service record is verified.</p></main><!-- BUNDLED_APP --></body></html>
