<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EasyLayer · 쉬운 예약 체험</title><style>
:root{font-family:system-ui,'Noto Sans KR',sans-serif;color:#17332e;background:#f3f6f3;font-size:20px;line-height:1.6}*{box-sizing:border-box}body{margin:0}header,main,footer{max-width:1080px;margin:auto;padding:20px 28px}header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:800;font-size:28px}.badge{font-size:16px;background:#fff1c7;padding:6px 14px;border-radius:10px}.layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(260px,1fr);gap:24px}.card{background:white;border:1px solid #d8e2dc;border-radius:24px;padding:28px}h1{font-size:32px;line-height:1.35;margin:0 0 16px}h2{font-size:23px;margin-top:0}p{margin:12px 0}.muted{color:#4c625b;font-size:18px}button,a,input{font:inherit}button{cursor:pointer;min-height:58px;border-radius:12px;padding:12px 18px;border:1px solid #647b70;color:#17332e;background:white;touch-action:manipulation}button:hover{background:#eef4f0}button:disabled{cursor:default;opacity:.55}.primary{background:#13634c;color:white;border-color:#13634c}.primary:hover{background:#0b4e3b}.options{display:grid;gap:12px;margin:20px 0}.option{text-align:left;display:flex;flex-direction:column}.row{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}.notice{border-left:5px solid #aa6500;background:#fff4df;padding:14px 18px;margin-bottom:20px}.success{background:#e9f4ee;padding:18px;border-radius:12px}.summary-item{border-bottom:1px solid #dde5df;padding:14px 0}.summary-item button{font-size:17px;min-height:48px;padding:7px 13px;margin-top:8px}label{display:block;font-weight:650;margin-top:18px}input{width:100%;padding:14px;border:2px solid #73867d;border-radius:10px;min-height:60px}input[aria-invalid=true]{border-color:#a32727}.error{color:#a32727;font-size:18px}button:focus-visible,input:focus-visible,a:focus-visible{outline:4px solid #bb6700;outline-offset:4px}.skip{position:absolute;left:-10000px}.skip:focus{left:16px;top:16px;background:white;z-index:10}details{margin-top:24px}summary{cursor:pointer;padding:12px 0}.status{min-height:32px;font-weight:650}.large{font-size:24px}.large h1{font-size:38px}footer{font-size:16px;color:#4c625b}#progress{font-size:17px}.check{display:flex;align-items:center;gap:12px;font-weight:400}.check input{width:25px;min-height:25px} @media(max-width:760px){.layout{grid-template-columns:1fr}header,main,footer{padding:16px}.card{padding:22px}h1{font-size:28px}.row button{flex-grow:1}}
</style></head><body><a class="skip" href="#panel">현재 선택으로 이동</a><header><span class="brand">EasyLayer</span><span class="badge">체험 모드 · 실제 예약·결제 없음</span><button id="size" aria-pressed="false">글씨 더 크게</button></header><main><p id="progress"></p><div id="status" class="status" role="status" aria-live="polite"></div><div class="layout"><section class="card" id="panel" tabindex="-1"></section><aside class="card" aria-label="선택한 내용"><h2>지금까지 선택한 내용</h2><div id="summary"></div><p class="muted">변경한 조건을 확인한 뒤 예약을 확정합니다.</p></aside></div><details><summary>체험 시나리오 설정</summary><p class="muted">아래 사례는 화면과 상태 처리 검증을 위한 모의 상황입니다. 실제 사이트·Alexa·음성 인식은 연결되지 않았습니다.</p><div class="row"><button data-scenario="success">정상 완료</button><button data-scenario="full">선택 시간 마감</button><button data-scenario="lost">응답 유실</button></div><p id="scenario-label">현재: 정상 완료</p></details></main><footer>선택 내용은 이 페이지 안에서만 사용합니다. 새로고침하면 입력과 체험 내역이 사라집니다. 실제 개인정보 대신 예시 정보를 입력해 주세요.</footer><script src="flow.js"></script><script src="ui.js"></script></body></html>
